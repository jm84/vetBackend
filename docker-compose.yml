services:
  postgres:
    image: postgres:16-alpine
    container_name: vetnest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vetnest
    ports:
      - '5432:5432'
    volumes:
      - pgdata_vetnest:/var/lib/postgresql/data

volumes:
  pgdata_vetnest:
